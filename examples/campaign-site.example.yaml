# Copy and replace these site-specific placeholders; there are no account defaults.
# Planning and controller work are CPU-only computations, not a promise that
# your account/partition accepts CPU-only allocations. Verify site eligibility.
# For a GPU-required partition, set its account/partition and controller.gpus: 1;
# the reserved controller GPU counts toward max_total_gpus even while idle.
# To retain eight one-GPU workers with that controller, use max_total_gpus: 9.
# A ready static check does not establish account quotas or scheduler admission.
controller:
  account: YOUR_ACCOUNT
  partition: YOUR_CPU_PARTITION
  cpus: 4
  memory_gb: 16
  walltime: "24:00:00"
  gpus: 0
  # constraint: YOUR_CONSTRAINT

# Snakemake can keep this many worker jobs active. The GPU ceiling also bounds
# workers with multi-GPU requests; it includes the controller's allocation.
max_workers: 8
max_total_gpus: 8
nofile: 65536
latency_wait: 60
