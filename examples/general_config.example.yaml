# TEMPLATE. Real configs live outside the repository, beside the campaign
# data, because their absolute paths belong to one machine. Copy, edit, and
# point a workflow index at your copy.

schema_version: 1

campaign:
  name: dio3-cut-test

target:
  name: dio3-cut
  sequence_fasta: /absolute/path/to/binder_design/mosaic_setup/dio3_cut/dio3_cut.fasta
  # Supply an existing A3M, or set an absolute output path and run
  # `bindocracy target prepare-msa` before loading configs / scoring.
  # See docs/scoring-stage.md section 9 for the ProtForge search command.
  msa: /absolute/path/to/binder_design/mosaic_setup/dio3_cut/msa_out/sequences/dio3_cut/msa/DIO3.a3m
  chain_id: A
  # Produced by legacy/00_target/. Mosaic folds the target from sequence but
  # uses this PDB to map author-numbered hotspots onto FASTA positions.
  structure_pdb: /absolute/path/to/binder_design/outputs/_shared/dio3_cut.pdb
  # BoltzGen and PXDesign require the mmCIF geometry.
  structure_cif: /absolute/path/to/binder_design/outputs/_shared/dio3_cut.cif
  hotspots: []

cluster:
  executor: slurm
  account: kempner_bsabatini_lab
  default_partition: kempner_h100
