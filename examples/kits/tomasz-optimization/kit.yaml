# A kit: everything about this optimizer that is true wherever it runs.
#
# This one WRAPS the DIO3 campaign's own `run_design.py` rather than
# reimplementing its protocol. An earlier version reimplemented it and diverged
# in six places; the entrypoint's docstring names them. What is here is only the
# manifest -- nothing about the protocol itself, because this kit does not own it.
#
#   uv run bindocracy --json kit check examples/kits/tomasz-optimization \
#       --bindings /path/to/bindings.yaml

kit_schema: 1

name: tomasz-optimization
version: 0.2.0
kind: optimizer
summary: >-
  Refine an existing binder with the DIO3 campaign's soft-sharp cycling
  protocol, by invoking the campaign's own run_design.py with --init-fasta and
  --init-noise-random and translating its designs_seed*.json into child rows.
  Each parent gets N children from independently perturbed starts.

entrypoint: optimizer.py
python: ">=3.11"

requires:
  - name: bindocracy-io
    kind: harness_module
    provided_by: harness
    version: ">=1"
    verify:
      files: ["drivers/bindocracy_io.py"]
    why: >-
      Archived beside the script by the harness and put on PYTHONPATH. NOTE
      this kit does not import it: run_design.py batches B trajectories in one
      process, so the entrypoint reads and writes the JSONL contract by hand to
      keep one invocation per chunk instead of one per parent. The requirement
      stays declared because the harness archives the helper regardless, and
      docs/custom-optimization.md keeps the raw path a supported contract.

  - name: mosaic
    kind: container
    version: ">=2026.07.22"
    provides: interpreter
    verify:
      import: mosaic.optimizers
    why: >-
      The interpreter and every model run_design.py loads. `sys.executable`
      inside this container is what invokes the wrapped script, so the two
      share one environment by construction rather than by configuration.

  - name: design-scripts
    kind: source_overlay
    verify:
      files: ["run_design.py", "design_config.py"]
    why: >-
      THE WRAPPED SCRIPT. `run_design.py` imports `design_config` by bare name,
      so the two must sit in one directory and that directory is what this
      requirement names. It is a `source_overlay` rather than a container
      because it is a working tree, not an image: RUN_PARAMETERS.md records
      ~673 uncommitted lines across 11 files, so "anyone reproducing this work
      needs the working tree, not the SHA". Preflight digesting that tree is
      what makes a run's record mean anything.

  - name: mosaic-weights
    kind: weights
    mount: read_only
    verify:
      files: ["alphafold/params", "boltz"]
    why: >-
      REQUIRED for every run. design_config.py builds its models with NO
      data_dir -- `AlphaFold2(multimer=True, ...)`, `Boltz2()` -- so they reach
      for ~/.alphafold and ~/.boltz. The campaign's mosaic-exec.sh bind-mounts
      this tree's plain-named caches onto those dotted names inside a synthetic
      HOME; this harness has no bind hook, so the wrapper rebuilds that HOME as
      symlinks and hands it to the subprocess. Verified empirically: neither
      ~/.alphafold nor a populated ~/.boltz exists on this cluster, so without
      it af2 finds no params and boltz2 finds no checkpoint.

  - name: mosaic-src
    kind: source_overlay
    target: /opt/mosaic/src/mosaic
    verify:
      files: ["models/af2_msa.py", "losses/structure_prediction.py"]
    why: >-
      REQUIRED FOR EVERY RUN. Two capabilities are younger than the 2026-07-22
      image and neither is expressible as a version tag.
      `DistogramIPTMProxy.epitope_idx` (2026-08-13) is VERIFIED ABSENT from the
      shipped image, and `models/af2_msa.py` (2026-08-18) is what lets af2 fold
      against the campaign alignment at all. `mosaic_setup/mosaic/src/mosaic`
      satisfies both. Note the DEPTH: this binds onto /opt/mosaic/src/mosaic,
      one level below the scorer's MOSAIC_DEV_SRC.

inputs: [sequence]

# This conservative declaration is reviewed with the bundle and inherited by
# the locked config. Parameter overrides do not narrow its provenance claim.
# The per-child lm_af2 and lm_boltz2 flags retain the more specific evidence.
#
# ESMFold2 is in neither and stays the held-out judge.
loss_models: [af2, boltz2]

capabilities:
  changes_length: false
  # Children per parent, each from its own Dirichlet-perturbed start. Two is the
  # useful minimum; one child cannot distinguish a converged optimizer from a
  # lucky one.
  max_children: 8

metrics:
  loss:
    direction: min
    description: >-
      run_design.py's OWN final objective value for the winning cycle -- the
      optimizer's opinion of a child, never a measurement of it. Not comparable
      across --hard-sharp, which changes the forward pass, nor against a run
      with a different --models or --esmc-weight.
  cycle1_loss:
    direction: min
    description: >-
      The same objective at the FIRST cycle boundary. `loss` alone is a bare
      number; this is the within-run reference it moved from. A parent baseline
      is deliberately not computed here -- see the entrypoint docstring -- and
      the parent's real quality is already in the database from an independent
      scorer.
  best_cycle:
    direction: none
    description: >-
      Which cycle produced the winner, 1-based. The direct test of whether
      cycling earned its GPU: if this is almost always 1, it did not.
  opt_cycles:
    direction: none
    description: soft-sharp cycles requested
  n_substitutions:
    direction: none
    description: positions where the child differs from its parent
  seq_identity:
    direction: none
    description: >-
      Fraction of positions identical to the parent, 0..1. Read this before
      anything else: a 360-step schedule was designed to invent binders from
      noise, and seeding it from a parent does not by itself keep the child
      near one. The first GPU run came back at 0.03-0.08.
  opt_replicate:
    direction: none
    description: which independent optimization of this parent, 0-based
  opt_seed:
    direction: none
    description: >-
      The seed handed to run_design.py for this child's chunk. Two children of
      one parent differ only through this and the Dirichlet draw it keys, so
      without it the run cannot be reproduced from its own record.
  hard_sharp:
    direction: none
    description: 1 when the straight-through estimator ran, else 0
  lm_af2:
    direction: none
    description: 1 when af2 was in --models
  lm_boltz2:
    direction: none
    description: 1 when boltz2 was in --models

cost:
  gpu: required
  # MEASURED through THIS wrapper on 2026-09-25: two chunks of one parent x two
  # replicates, 385 s and 423 s per child, 27 min of task wall for 4 children
  # including model load and two JIT compiles (one per binder length).
  compile_seconds: 240
  per_parent_seconds: 405
  measured_on:
    run: refine-af2-canary, 2 parents x 2 replicates, exit 0
    gpu: H100-80GB
    binder_length: 71
    target_length: 201
    cycles: 3
    models: af2
    esmc_weight: 0
  scales_with: [binder_length, target_length, cycles, soft_steps, sharp_steps, replicates, max_batch]
  note: >-
    per_parent_seconds is for ONE child; the campaign multiplies by
    `replicates` as well as by the parent count. compile_seconds is paid per
    binder LENGTH per invocation, which is why parents are grouped by length
    and chunked -- the design set is length-ordered so a shard spans few groups.
    Memory, not time, is the hazard: `--max-batch` trajectories times the
    complex length is what overflowed an 80 GB H100 in the source campaign
    once the complex passed ~296 residues.

args:
  models: boltz2
  replicates: 2
  max-batch: 4
  # No default: it is a site path, supplied by the campaign as `--weights`.
  # The campaign's measured recommendation. 3 x (90+30) beat a single
  # 1 x (250+30) by +37% at ipTM >= 0.7 for +28% GPU; 3 x (250+30) -- 840 steps
  # -- was the WORST cycling arm on every column.
  cycles: 3
  soft-steps: 90
  sharp-steps: 30
  # 0.15 both, which is the wrapped script's own default and what the pipeline
  # used when it re-seeded R23's designs into R24-A.
  init-noise: 0.15
  cycle-noise: 0.15
  recycling-steps: 1
  # 0.5, the source campaign's value in every round. It was briefly set to 0
  # here after esmc_pll came back NaN -- but the cause was NOT the image and
  # NOT the campaign: a probe run from this repo resolved the checkpoint by
  # REPO NAME against the hub, pulled an upstream re-version into the shared
  # cache and repointed refs/main. The new revision renames the class and every
  # tensor, so the container's pinned class initialized random weights.
  # refs/main has been restored and the checkpoint is now PINNED to a snapshot
  # path, which is resolved locally and cannot drift.
  esmc-weight: 0.5
  # A store_true flag: transcribe as a bare `--hard-sharp` or omit it, never as
  # `--hard-sharp false`. Off by default -- it gave 2.2x at one site and was
  # strictly worse at two others.
  hard-sharp: false

dependency_args:
  design-scripts: --design-script
  mosaic-weights: --weights
