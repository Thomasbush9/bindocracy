[project]
name = "bindocracy"
version = "0.1.0"
description = "Run many binder-design models from one place, on one cluster, into one database."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # --- workflow engine -------------------------------------------------
    # Snakemake 9 moved its executors out of core, so the SLURM backend is a
    # separate plugin. It pulls snakemake-executor-plugin-slurm-jobstep in
    # automatically -- that is the piece that runs inside the job step, and
    # you should not depend on it directly.
    "snakemake>=9.26",
    "snakemake-executor-plugin-slurm>=2.8",

    # --- data ------------------------------------------------------------
    "duckdb>=1.5",

    # --- configuration ---------------------------------------------------
    # pyyaml parses the configs; pydantic validates them at submit time, so a
    # mistyped key fails in a second instead of 40 minutes into a GPU job.
    "pyyaml>=6.0",
    "pydantic>=2.9",

    # --- CLI -------------------------------------------------------------
    "typer>=0.15",
]

# Nothing below is imported by the library. They are here because a person
# wants them, or because a feature that needs them is not written yet; keeping
# them out of the default install makes `uv sync` faster and cannot break it.
[project.optional-dependencies]
# For the reporting and structure work that does not exist yet: pandas and
# pyarrow for a unified design table, biotite for mmCIF (BoltzGen writes CIF
# only), matplotlib for figures.
reporting = ["pandas>=2.2", "pyarrow>=17", "matplotlib>=3.9"]
structures = ["biotite>=1.7"]

[project.scripts]
bindocracy = "bindocracy.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    # Terminal SQL IDE with a DuckDB adapter: the way a campaign database gets
    # read on a login node, without forwarding a port for duckdb's browser UI.
    # A working tool rather than a library requirement, but it belongs in the
    # group `uv sync` installs by default -- an inspection tool nobody has is
    # not an inspection tool. See docs/env-setup.md.
    "harlequin>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bindocracy"]

[tool.ruff]
line-length = 100
target-version = "py312"
