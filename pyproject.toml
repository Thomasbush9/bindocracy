[project]
name = "bindocracy"
version = "0.1.0"
description = "Run many binder-design models from one place, on one cluster, into one database."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # --- workflow engine -------------------------------------------------
    # Snakemake 9 moved its executors out of core, so the SLURM backend is a
    # separate plugin. It pulls snakemake-executor-plugin-slurm-jobstep in
    # automatically -- that is the piece that runs inside the job step, and
    # you should not depend on it directly.
    "snakemake>=9.26",
    "snakemake-executor-plugin-slurm>=2.8",

    # --- data ------------------------------------------------------------
    "duckdb>=1.5",

    # --- configuration ---------------------------------------------------
    # pyyaml parses the configs; pydantic validates them at submit time, so a
    # mistyped key fails in a second instead of 40 minutes into a GPU job.
    "pyyaml>=6.0",
    "pydantic>=2.9",

    # --- CLI -------------------------------------------------------------
    "typer>=0.15",
]

# Nothing below is imported by the library, so it stays out of the wheel's
# install_requires -- but it is all in the dev group, which `uv sync` installs
# by default. A package missing from the environment someone works in is a
# broken tool, not a lean dependency tree.

[project.scripts]
bindocracy = "bindocracy.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    # Terminal SQL IDE with a DuckDB adapter: the way a campaign database gets
    # read on a login node, without forwarding a port for duckdb's browser UI.
    # See docs/env-setup.md.
    "harlequin>=2.10",

    # Not imported by the library yet, and kept installed anyway because the
    # analysis they are for is done by hand in this environment: pandas and
    # pyarrow for reading designs out of the database, biotite for mmCIF
    # (BoltzGen writes CIF only, so the stdlib cannot read its structures),
    # matplotlib for figures.
    "pandas>=2.2",
    "pyarrow>=17",
    "biotite>=1.7",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bindocracy"]

[tool.ruff]
line-length = 100
target-version = "py312"
